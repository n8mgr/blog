name: Prepare Release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      - name: Prepare release
        id: prepare
        run: knope prepare-release --verbose
        continue-on-error: true
      - name: Create pull request
        if: steps.prepare.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: master
          branch: release
          commit-message: "chore: prepare release"
          delete-branch: true
          title: Release
          body: Merge to publish.
